[exclude]
# list excluded tests and directories here

# intl not supported
test262/test/intl402/


# slow tests
#test262/test/built-ins/RegExp/CharacterClassEscapes/
#test262/test/built-ins/RegExp/property-escapes/

# destructuring performance improvements (V8 has the same spec non-compliance)


# staging/sm is Mozilla's OWN suite, converted: it asserts SpiderMonkey extensions (Function.prototype.caller
# and its frame rules, Annex-B block-function scoping details, error-message shapes) that no spec pins, so
# running it as a GATE would enshrine non-spec behaviour. It is still worth RUNNING by hand — four capability
# gaps and a 535-object leak came out of it in one sitting — which is what `node engine/test262.mjs staging`
# does, exclusions and all.
#
# The REST of staging is test262 proper, and it was excluded only because upstream excludes the directory
# wholesale as "frequently broken". That is a chosen subset masquerading as a corpus: it hid three
# [[PreventExtensions]] failures on length-tracking typed arrays and a RegExp.escape that walked code units
# where the spec walks code points. Those are fixed, these directories pass, and they are IN the gate now.
test262/test/staging/sm/

