[exclude]
# list excluded tests and directories here

# intl not supported
test262/test/intl402/


# slow tests
#test262/test/built-ins/RegExp/CharacterClassEscapes/
#test262/test/built-ins/RegExp/property-escapes/

# destructuring performance improvements (V8 has the same spec non-compliance)


# staging/sm is Mozilla's OWN suite, converted: it asserts SpiderMonkey extensions (Function.prototype.caller
# and its frame rules, error-message shapes) that no spec pins, so running it as a GATE would enshrine non-spec
# behaviour. It is still worth RUNNING by hand — four capability gaps and a 535-object leak came out of it in one
# sitting — which is what `node engine/test262.mjs staging` does, exclusions and all.
#
# THE DIRECTORY EXCLUSION IS THE COARSE HALF AND IT WAS WRONG ABOUT TWO FILES. "No spec pins it" is a claim, and
# a claim about a whole tree is one nobody re-checks per file; it survived here for the two Annex-B files below
# through a citation that had gone stale. The per-file entries are the judgements that must survive, so a file
# this tree excludes WRONGLY is re-admitted BY NAME with the reason, exactly like a file excluded by name.
#
# The REST of staging is test262 proper, and it was excluded only because upstream excludes the directory
# wholesale as "frequently broken". That is a chosen subset masquerading as a corpus: it hid three
# [[PreventExtensions]] failures on length-tracking typed arrays and a RegExp.escape that walked code units
# where the spec walks code points. Those are fixed, these directories pass, and they are IN the gate now.
test262/test/staging/sm/

# ONE FILE, AND THE REASON IS THE DESIGN. `function eval() { eval(); }` recurses forever, and its oracle is
# that SOME limit stops it — every other engine answers with a stack-overflow RangeError that the test's bare
# `catch (e) {}` swallows. This fork has no such limit BY CONSTRUCTION: calls trampoline onto the heap, so
# JS_ThrowStackOverflow is unreachable and a depth cap is exactly what CLAUDE.md forbids. An infinite recursion
# is therefore an infinite loop, and it runs until the physical floor — which in the real engine is the flow
# parking and its cold tail paging to IndexedDB, and in this harness is the OOM killer, because a test process
# has no cold tier to page into. Adding a cap to make this file pass would trade the property the fork exists
# to have for a green line.
test262/test/staging/sm/extensions/recursion.js

# WHAT IS LEFT IN sm, CHARACTERISED. A by-hand `node engine/test262.mjs staging/sm` ran 1404 tests with three
# failures. Two of them were this engine being wrong and are now in the gate; the third is the suite asserting a
# choice no spec pins, which is what the tree exclusion is actually for:
#   Function/builtin-no-construct reads every property of every builtin, and `RegExp.$1` before any match is
#   GetLegacyRegExpStaticProperty step 4's "if val is empty, throw a TypeError". No test262 file pins that step
#   either way; the proposal's text does, and it is followed.

# THESE TWO ARE SPEC-TRUE AND BELONG IN THE GATE. Both assert that a block-level `function arguments(){}` in
# sloppy code overwrites the Arguments object, and 10.2.11's legacy clause says exactly that: its carve-out is
# "If instantiatedVariableNames does not contain funcName and funcName is not "arguments"", which guards only the
# binding CREATION, while the SetMutableBinding that runs when the declaration is evaluated is that step's
# SIBLING and applies to every funcName the outer condition admitted. The outer condition's own test is
# "paramNames does not contain funcName", and paramNames is the BoundNames of the formals.
#
# It was ES2017 that put "arguments" into that list — step 22.f, "Append "arguments" to parameterNames" — and
# ES2018 replaced it with a separate parameterBindings list, leaving paramNames alone. Every edition since says
# the store runs. So does V8: `(function(){ { function arguments(){} } return typeof arguments })()` is
# "function" in node 22 / V8 12.4.
!test262/test/staging/sm/lexical-environment/block-scoped-functions-annex-b-arguments.js
!test262/test/staging/sm/regress/regress-602621.js

# AND THIS ONE IS THE STALE ORACLE THEY CONTRADICT. block-decl-func-skip-arguments asserts the OPPOSITE — that
# `arguments.toString()` is still "[object Arguments]" after the block — and it quotes its own reason in its
# `info:` block: "22. If argumentsObjectNeeded is true, then f. Append "arguments" to parameterNames." That step
# has not existed since ES2017. V8 wrote the file in 2017 and V8 now FAILS it (all three of its cases), test262
# has not touched it since beyond a harness rename, and the two sm files above are the current reading. Keeping
# it in the gate is what held the engine on the 2017 text.
test262/test/annexB/language/function-code/block-decl-func-skip-arguments.js

